name: Static Code Analysis On Bank App Backend


on: 
  push: 
    branches:
      - SeOps


jobs:
  Dependency-Check:
    name: OWASP-Dependency-Check
    runs-on: ubuntu-latest
    environment: SecOps

    steps: 
      - name: Checkout repository.
        uses: actions/checkout@v3
        with:
          repository: digitalwitchdemo/main_bank_app_backend
          ref: SeOps

      - name: SetUp JDK 1.8 
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '21'


      - name: Dependency check lib installation
        run: | 
             mvn org.owasp:dependency-check-maven:check -DnvdApiKey=6b19ac9f-56c6-4511-8db6-2c3f5dd85585
             ls -la ./target
             cat ./target/dependency-check-report.csv


      - name: Uploading to DefectDojo
        run: | 
             chmod +x dependency-check-upload.sh
             sh dependency-check-upload.sh
        


  Code-Quality-Evaluation-ScanSonarube:
    name: sonarqube-SAST-scan
    runs-on: ubuntu-latest
    needs: Dependency-Check

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        
    - name: Set Up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache SonarQube packages
      run: mvn clean verify 
    
    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      with:
        projectBaseDir: .
        args: >
          -Dsonar.organization=securespherelabs
          -Dsonar.projectKey=bank-app-backend
          -Dsonar.sources=src/main/java
          -Dsonar.java.binaries=target/classes
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}















